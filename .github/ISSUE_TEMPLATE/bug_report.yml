name: Bug report
description: Something in an SDK does not match the NOWPayments API or crashes.
title: "[bug] "
labels:
  - bug
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - nowpayments-node
        - nowpayments-py
        - nowpayments-php
        - nowpayments-go
        - nowpayments-ruby
        - nowpayments-rust
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what the SDK did instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A short snippet. Remove API keys and IPN secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Runtime
      description: Language version, OS, and whether you used the sandbox API.
