[package]
name = "nowpayments-rust"
version = "1.0.4"
edition = "2021"
description = "Full-featured Rust SDK for NOWPayments cryptocurrency payment API"
license = "MIT"
authors = ["Foisalislambd"]
repository = "https://github.com/Foisalislambd/nowpayments-rust"
keywords = ["nowpayments", "crypto", "cryptocurrency", "bitcoin", "ethereum", "payment", "payment-gateway"]
categories = ["api-bindings", "cryptography"]

[dependencies]
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
subtle = "2.6.1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
